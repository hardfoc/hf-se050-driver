<text x="56" y="541" font-size="17" fill="#2B3442">T1Session: ChipWarmReset, GetAnswerToReset, ExchangeInformation; CRC-16 EDC, chaining, WTX, resync;</text>
<text x="56" y="565.7" font-size="17" fill="#2B3442">scp03::Session wraps APDUs when open; I2cTransceiveInterface&lt;Self&gt; is the CRTP base</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="693.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  I2cWrite()  I2cRead()  Transceive()  HardwareReset()  delay_ms_impl()</text>
<text x="56" y="792.4" font-size="20" font-weight="700" fill="#17202C">SE050</text>
<text x="56" y="823" font-size="17" fill="#2B3442">I2C target, address 0x48, T=1 over I2C  /  ENA (deep power-down)</text>
